# Reuse the DeepSeek account sign-in that the desktop app stored in ~/.dsh,
# instead of the API-key route (deepseek-official) that headless/sdk default to.
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-account
    model: deepseek-flash
- id: deepseek-account
  name: "@deepseek-ai/dsh-deepseek-account-platform"
  disabled: false
- id: authorization
  name: "@deepseek-ai/dsh-authorization"
  disabled: false
- id: credentials
  name: "@deepseek-ai/dsh-credentials-local"
  disabled: false
