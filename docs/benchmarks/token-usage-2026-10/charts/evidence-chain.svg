<svg xmlns="http://www.w3.org/2000/svg" width="900" height="808" viewBox="0 0 900 808" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif">
<rect width="900" height="808" fill="#FFFFFF"/>
<text x="24" y="36" font-size="19" font-weight="600" fill="#0F172A">Evidence chain: one real hand-over, from request to acceptance</text>
<line x1="32" x2="32" y1="97" y2="159" stroke="#D5DAE2" stroke-width="1.5"/>
<circle cx="32" cy="91" r="5" fill="#5B6577"/>
<text x="46" y="95.5" font-size="13" font-weight="600" fill="#3B4556">User</text>
<rect x="184" y="64" width="692" height="54" rx="8" fill="#F6F7F9" stroke="#E6E9EF" stroke-width="1"/>
<text x="200" y="86" font-size="14" font-weight="600" fill="#0F172A">1. Asks for it</text>
<text x="200" y="106" font-size="12.5" fill="#3B4556">One plain-language request: a small task manager web app (Node server + front-end page)</text>
<line x1="32" x2="32" y1="171" y2="233" stroke="#D5DAE2" stroke-width="1.5"/>
<circle cx="32" cy="165" r="5" fill="#2563EB"/>
<text x="46" y="169.5" font-size="13" font-weight="600" fill="#3B4556">Codex (main agent)</text>
<rect x="184" y="138" width="692" height="54" rx="8" fill="#F6F7F9" stroke="#E6E9EF" stroke-width="1"/>
<text x="200" y="160" font-size="14" font-weight="600" fill="#0F172A">2. Writes spec + checks, dsh_send</text>
<text x="200" y="180" font-size="12.5" fill="#3B4556">Spec of 1,401 characters; 2 checks: npm test, and package.json has zero dependencies</text>
<line x1="32" x2="32" y1="245" y2="307" stroke="#D5DAE2" stroke-width="1.5"/>
<circle cx="32" cy="239" r="5" fill="#C27803"/>
<text x="46" y="243.5" font-size="13" font-weight="600" fill="#3B4556">dsh-baton</text>
<rect x="184" y="212" width="692" height="54" rx="8" fill="#FBF6EC" stroke="#EAD7B0" stroke-width="1"/>
<text x="200" y="234" font-size="14" font-weight="600" fill="#0F172A">3. Snapshots the folder before sending</text>
<text x="200" y="254" font-size="12.5" fill="#3B4556">Records every file's hash and line count (the folder was empty then)</text>
<line x1="32" x2="32" y1="319" y2="381" stroke="#D5DAE2" stroke-width="1.5"/>
<circle cx="32" cy="313" r="5" fill="#0E9F6E"/>
<text x="46" y="317.5" font-size="13" font-weight="600" fill="#3B4556">DeepSeek Harness</text>
<rect x="184" y="286" width="692" height="54" rx="8" fill="#F6F7F9" stroke="#E6E9EF" stroke-width="1"/>
<text x="200" y="308" font-size="14" font-weight="600" fill="#0F172A">4. Does the work</text>
<text x="200" y="328" font-size="12.5" fill="#3B4556">DeepSeek V4.1 Flash 1017: 49 requests, writes 11 files: server.js 452 lines, public/app.js 818, tests 600…</text>
<line x1="32" x2="32" y1="393" y2="455" stroke="#D5DAE2" stroke-width="1.5"/>
<circle cx="32" cy="387" r="5" fill="#C27803"/>
<text x="46" y="391.5" font-size="13" font-weight="600" fill="#3B4556">dsh-baton</text>
<rect x="184" y="360" width="692" height="54" rx="8" fill="#FBF6EC" stroke="#EAD7B0" stroke-width="1"/>
<text x="200" y="382" font-size="14" font-weight="600" fill="#0F172A">5. Run ends: compares files, runs the checks itself</text>
<text x="200" y="402" font-size="12.5" fill="#3B4556">11 created, 0 changed, 0 deleted; npm test exit code 0 (9 tests pass); zero-dependency check passes</text>
<line x1="32" x2="32" y1="467" y2="529" stroke="#D5DAE2" stroke-width="1.5"/>
<circle cx="32" cy="461" r="5" fill="#2563EB"/>
<text x="46" y="465.5" font-size="13" font-weight="600" fill="#3B4556">Codex (main agent)</text>
<rect x="184" y="434" width="692" height="54" rx="8" fill="#F6F7F9" stroke="#E6E9EF" stroke-width="1"/>
<text x="200" y="456" font-size="14" font-weight="600" fill="#0F172A">6. Reads the evidence and reviews; sends one fix back on its own</text>
<text x="200" y="476" font-size="12.5" fill="#3B4556">README /api/stats example says total=6, should be 5; sends only this fix, with one new check</text>
<line x1="32" x2="32" y1="541" y2="603" stroke="#D5DAE2" stroke-width="1.5"/>
<circle cx="32" cy="535" r="5" fill="#0E9F6E"/>
<text x="46" y="539.5" font-size="13" font-weight="600" fill="#3B4556">DeepSeek Harness</text>
<rect x="184" y="508" width="692" height="54" rx="8" fill="#F6F7F9" stroke="#E6E9EF" stroke-width="1"/>
<text x="200" y="530" font-size="14" font-weight="600" fill="#0F172A">7. Fixes it</text>
<text x="200" y="550" font-size="12.5" fill="#3B4556">Changes one place in README.md</text>
<line x1="32" x2="32" y1="615" y2="677" stroke="#D5DAE2" stroke-width="1.5"/>
<circle cx="32" cy="609" r="5" fill="#C27803"/>
<text x="46" y="613.5" font-size="13" font-weight="600" fill="#3B4556">dsh-baton</text>
<rect x="184" y="582" width="692" height="54" rx="8" fill="#FBF6EC" stroke="#EAD7B0" stroke-width="1"/>
<text x="200" y="604" font-size="14" font-weight="600" fill="#0F172A">8. Compares and checks again</text>
<text x="200" y="624" font-size="12.5" fill="#3B4556">README.md changed (251 lines → 251 lines); "total": 5 check passes</text>
<line x1="32" x2="32" y1="689" y2="751" stroke="#D5DAE2" stroke-width="1.5"/>
<circle cx="32" cy="683" r="5" fill="#2563EB"/>
<text x="46" y="687.5" font-size="13" font-weight="600" fill="#3B4556">Codex (main agent)</text>
<rect x="184" y="656" width="692" height="54" rx="8" fill="#F6F7F9" stroke="#E6E9EF" stroke-width="1"/>
<text x="200" y="678" font-size="14" font-weight="600" fill="#0F172A">9. Accepts</text>
<text x="200" y="698" font-size="12.5" fill="#3B4556">Codex $0.126 in total, about 1% of the Plus 5-hour window; DeepSeek $0.224 (at peak price)</text>
<circle cx="32" cy="757" r="5" fill="#0F172A"/>
<text x="46" y="761.5" font-size="13" font-weight="600" fill="#3B4556">Independent test</text>
<rect x="184" y="730" width="692" height="54" rx="8" fill="#F6F7F9" stroke="#E6E9EF" stroke-width="1"/>
<text x="200" y="752" font-size="14" font-weight="600" fill="#0F172A">10. The benchmark's own acceptance test</text>
<text x="200" y="772" font-size="12.5" fill="#3B4556">13/13 pass: start, create/read/update/delete, stats, 400/404, data written to DATA_FILE</text>
</svg>
