<text x="20" y="53" font-size="12.5" fill="#5B6577">彩色 = 主 Agent，灰色 = DeepSeek（按高峰价）；“自己做”不用 DeepSeek，所以没有灰色。柱顶 = 合计，两段交界处 = 只算主 Agent。</text>
<text x="20" y="72" font-size="12.5" fill="#5B6577">估算：用 Sol 实测的 token 数，按 Astra 标价（每百万 输入 $10、缓存 $1、输出 $50）重新计价；3 次平均。</text>
