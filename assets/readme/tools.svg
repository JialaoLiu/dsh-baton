<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="548" viewBox="0 0 1200 548" role="img" aria-labelledby="title desc">
  <title id="title">dsh-bridge MCP tools</title>
  <desc id="desc">Workspaces: list, create, rename. Sessions: list, read, activity, rename. Runs: send, status, wait, cancel, list runs.</desc>
  <rect width="1200" height="548" rx="24" fill="#FFFFFF"/>
<text x="64" y="76" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" fill="#0F172A" font-weight="700">12 tools, three things to control</text>
<rect x="64" y="104" width="341" height="404" rx="16" fill="#F4F6FA" stroke="#E2E7EF" stroke-width="1"/>
<text x="90" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#2563EB" letter-spacing="2">WORKSPACES</text>
<text x="90" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#0F172A" font-weight="600">dsh_list_workspaces</text>
<text x="90" y="224" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#5B6577">sidebar workspaces</text>
<text x="90" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#0F172A" font-weight="600">dsh_create_workspace</text>
<text x="90" y="288" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#5B6577">register a folder</text>
<text x="90" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#0F172A" font-weight="600">dsh_rename_workspace</text>
<text x="90" y="352" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#5B6577">sidebar title only</text>
<rect x="429" y="104" width="341" height="404" rx="16" fill="#F4F6FA" stroke="#E2E7EF" stroke-width="1"/>
<text x="455" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#2563EB" letter-spacing="2">SESSIONS</text>
<text x="455" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#0F172A" font-weight="600">dsh_list_sessions</text>
<text x="455" y="224" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#5B6577">newest first, filterable</text>
<text x="455" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#0F172A" font-weight="600">dsh_read_session</text>
<text x="455" y="288" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#5B6577">recent prompts + replies</text>
<text x="455" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#0F172A" font-weight="600">dsh_session_activity</text>
<text x="455" y="352" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#5B6577">turn, sub-agents, jobs</text>
<text x="455" y="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#0F172A" font-weight="600">dsh_rename_session</text>
<text x="455" y="416" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#5B6577">rename a session</text>
<rect x="794" y="104" width="341" height="404" rx="16" fill="#F4F6FA" stroke="#E2E7EF" stroke-width="1"/>
<text x="820" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#2563EB" letter-spacing="2">RUNS</text>
<text x="820" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#0F172A" font-weight="600">dsh_send</text>
<text x="820" y="224" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#5B6577">start a run → run_id</text>
<text x="820" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#0F172A" font-weight="600">dsh_status</text>
<text x="820" y="288" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#5B6577">progress + final reply</text>
<text x="820" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#0F172A" font-weight="600">dsh_wait</text>
<text x="820" y="352" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#5B6577">block until it ends</text>
<text x="820" y="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#0F172A" font-weight="600">dsh_cancel</text>
<text x="820" y="416" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#5B6577">stop turn, agents, jobs</text>
<text x="820" y="452" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#0F172A" font-weight="600">dsh_list_runs</text>
<text x="820" y="480" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#5B6577">recent runs</text>
</svg>
