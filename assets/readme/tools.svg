<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="656" viewBox="0 0 1200 656" role="img" aria-labelledby="title desc">
  <title id="title">dsh-baton MCP tools</title>
  <desc id="desc">Listed: list workspaces, list sessions, read session, send, status, wait, answer, cancel, call. Less used, reached through dsh_call: create and rename workspace, session activity, rename session, update queued, list runs.</desc>
  <rect width="1200" height="656" rx="24" fill="#FFFFFF"/>
<text x="64" y="76" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" fill="#0F172A" font-weight="700">9 tools listed, 6 more through dsh_call</text>
<rect x="64" y="104" width="341" height="276" rx="16" fill="#F4F6FA" stroke="#E2E7EF" stroke-width="1"/>
<text x="90" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#2563EB" letter-spacing="2">WORKSPACES · SESSIONS</text>
<text x="90" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#0F172A" font-weight="600">dsh_list_workspaces</text>
<text x="90" y="224" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#5B6577">sidebar workspaces</text>
<text x="90" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#0F172A" font-weight="600">dsh_list_sessions</text>
