<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="528" viewBox="0 0 1200 528" role="img" aria-labelledby="title desc">
  <title id="title">What dsh-bridge does</title>
  <desc id="desc">Six capabilities: create workspaces and sessions, continue a specific session, run live in the Harness UI, get woken when a run ends, no extra API key, zero dependencies and local only.</desc>
  <rect width="1200" height="528" rx="24" fill="#FFFFFF"/>
<rect x="64" y="56" width="341" height="196" rx="16" fill="#F4F6FA" stroke="#E2E7EF" stroke-width="1"/>
<g transform="translate(90 80)" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10 h12 l4 5 h20 v21 h-36 z"/><path d="M20 21 v10 M15 26 h10"/></g>
<text x="90" y="160" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#0F172A" font-weight="700">Workspaces + sessions</text>
<text x="90" y="198" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#5B6577">Start Harness in any folder;</text>
<text x="90" y="226" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#5B6577">it shows in the sidebar.</text>
<rect x="429" y="56" width="341" height="196" rx="16" fill="#F4F6FA" stroke="#E2E7EF" stroke-width="1"/>
<g transform="translate(455 80)" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20 a14 14 0 1 1 6 11"/><path d="M2 14 l4 7 l7 -4"/></g>
<text x="455" y="160" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#0F172A" font-weight="700">Continue a session</text>
<text x="455" y="198" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#5B6577">Send by session_id and keep</text>
<text x="455" y="226" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#5B6577">its full context.</text>
<rect x="794" y="56" width="341" height="196" rx="16" fill="#F4F6FA" stroke="#E2E7EF" stroke-width="1"/>
<g transform="translate(820 80)" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="36" height="28" rx="4"/><path d="M2 14 h36"/><circle cx="20" cy="24" r="4" fill="#2563EB"/></g>
<text x="820" y="160" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#0F172A" font-weight="700">Live in the Harness UI</text>
<text x="820" y="198" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#5B6577">Runs exactly as if you</text>
<text x="820" y="226" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#5B6577">typed it yourself.</text>
<rect x="64" y="276" width="341" height="196" rx="16" fill="#F4F6FA" stroke="#E2E7EF" stroke-width="1"/>
<g transform="translate(90 300)" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10 28 v-10 a10 10 0 0 1 20 0 v10 l3 4 h-26 z"/><path d="M17 36 h6"/></g>
<text x="90" y="380" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#0F172A" font-weight="700">Woken when it's done</text>
<text x="90" y="418" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#5B6577">Block with dsh_wait, or run</text>
<text x="90" y="446" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#5B6577">wait in the background.</text>
<rect x="429" y="276" width="341" height="196" rx="16" fill="#F4F6FA" stroke="#E2E7EF" stroke-width="1"/>
<g transform="translate(455 300)" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="20" r="7"/><path d="M19 20 h17 M30 20 v6 M35 20 v4"/><path d="M4 36 L36 4" stroke="#5B6577"/></g>
<text x="455" y="380" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#0F172A" font-weight="700">No extra API key</text>
<text x="455" y="418" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#5B6577">Reuses the desktop sign-in,</text>
<text x="455" y="446" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#5B6577">presets and settings.</text>
<rect x="794" y="276" width="341" height="196" rx="16" fill="#F4F6FA" stroke="#E2E7EF" stroke-width="1"/>
<g transform="translate(820 300)" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="18" width="26" height="18" rx="3"/><path d="M13 18 v-6 a7 7 0 0 1 14 0 v6"/></g>
<text x="820" y="380" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#0F172A" font-weight="700">Zero deps, local only</text>
<text x="820" y="418" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#5B6577">Node stdlib, one owner-only</text>
<text x="820" y="446" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#5B6577">socket, no network port.</text>
</svg>
