<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Known limitations</title>
  <desc id="desc">Typing into a session in the Harness UI during a bridge run attributes that turn to the run; run ids reset when Harness restarts; prefer the background wait command over long dsh_wait calls. It also relies on Harness 0.2.1-series internal APIs.</desc>
  <rect width="1200" height="350" rx="24" fill="#FFFFFF"/>
<text x="64" y="76" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" fill="#0F172A" font-weight="700">Known limitations</text>
<rect x="64" y="104" width="341" height="210" rx="16" fill="#F4F6FA" stroke="#E2E7EF" stroke-width="1"/>
<rect x="64" y="130" width="4" height="30" fill="#C27803"/>
<text x="90" y="154" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" fill="#0F172A" font-weight="700">Don't type alongside</text>
<text x="90" y="196" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#5B6577">A message typed in the UI</text>
<text x="90" y="224" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#5B6577">during a bridge run is</text>
<text x="90" y="252" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#5B6577">counted as that run.</text>
<rect x="429" y="104" width="341" height="210" rx="16" fill="#F4F6FA" stroke="#E2E7EF" stroke-width="1"/>
<rect x="429" y="130" width="4" height="30" fill="#C27803"/>
<text x="455" y="154" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" fill="#0F172A" font-weight="700">Run ids reset</text>
<text x="455" y="196" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#5B6577">After a Harness restart old</text>
<text x="455" y="224" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#5B6577">run ids are gone; sessions</text>
<text x="455" y="252" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#5B6577">stay.</text>
<rect x="794" y="104" width="341" height="210" rx="16" fill="#F4F6FA" stroke="#E2E7EF" stroke-width="1"/>
<rect x="794" y="130" width="4" height="30" fill="#C27803"/>
<text x="820" y="154" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" fill="#0F172A" font-weight="700">Prefer background wait</text>
<text x="820" y="196" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#5B6577">MCP clients may time out</text>
<text x="820" y="224" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#5B6577">long dsh_wait calls.</text>
<text x="820" y="252" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#5B6577"></text>
</svg>
