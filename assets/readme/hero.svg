<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">dsh-bridge</title>
  <desc id="desc">dsh-bridge lets Claude Code or Codex hand a task to a local DeepSeek Harness over an owner-only local socket. A dsh_send call returns a run id; the same session appears in Harness, runs, and completes.</desc>
  <rect width="1200" height="420" rx="24" fill="#FFFFFF"/>
<g id="title-block" transform="translate(64 0)">
<text x="0" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5B6577" letter-spacing="2">MCP SERVER  +  HARNESS PLUGIN</text>
<text x="-3" y="170" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="76" fill="#0F172A" font-weight="700" letter-spacing="-2">dsh-bridge</text>
<text x="0" y="226" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="27" fill="#0F172A">Hand a task from Claude Code or Codex</text>
<text x="0" y="262" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="27" fill="#0F172A">to DeepSeek Harness, watch it run live,</text>
<text x="0" y="298" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="27" fill="#0F172A">and get woken <tspan fill="#2563EB">when it's done</tspan>.</text>
<text x="0" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5B6577">zero deps · local socket only · no API key · MIT</text>
</g>
<g id="proof" transform="translate(640 48)">
<rect x="0" y="0" width="496" height="124" rx="14" fill="#F4F6FA" stroke="#E2E7EF" stroke-width="1"/>
<text x="22" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5B6577">claude code</text>
<text x="22" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#0F172A"><tspan fill="#2563EB">›</tspan> dsh_send cwd=~/code/new-app</text>
<text x="22" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5B6577" opacity="1.000">← run_id hrun-7f3a</text>
<line x1="64" y1="124" x2="64" y2="200" stroke="#C9D2DF" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="64" y1="124" x2="64" y2="200.0" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 6" opacity="1.000"/>
<circle cx="64" cy="162" r="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="88" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5B6577">~/.dsh-bridge/host.sock  0600</text>
<rect x="0" y="200" width="496" height="124" rx="14" fill="#F4F6FA" stroke="#E2E7EF" stroke-width="1"/>
<text x="22" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5B6577">harness · session-91c2</text>
<text x="22" y="272" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#0F172A" opacity="1.000">Scaffold a Vite + React app…</text>
<g transform="translate(22 288)">
<rect x="0" y="0" width="104" height="26" rx="13" fill="none" stroke="#5B6577" stroke-width="1"/>
<text x="52.0" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#5B6577" text-anchor="middle">queued</text>
<rect x="116" y="0" width="110" height="26" rx="13" fill="none" stroke="#5B6577" stroke-width="1"/>
<text x="171.0" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#5B6577" text-anchor="middle">running</text>
<rect x="238" y="0" width="132" height="26" rx="13" fill="#2563EB"/>
<text x="304.0" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">completed</text>
</g></g>
</svg>
