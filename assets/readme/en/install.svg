<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="452" viewBox="0 0 1200 452" role="img" aria-labelledby="title desc">
  <title id="title">Install in one step, check in two</title>
  <desc id="desc">Install: in Harness open Plugins, Add plugin, enter dsh-baton-host, Install, Enable now; it registers dsh-baton for Claude Code and Codex. Then check that it works: open a new conversation in Claude Code or Codex (Codex asks once to approve the dsh-baton tools), and ask it to call dsh_list_workspaces; it lists your Harness workspaces.</desc>
  <rect width="1200" height="452" rx="24" fill="#FFFFFF"/>
<text x="64" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5B6577" letter-spacing="2">INSTALL</text><path d="M64 90 v-8 H405 v8" stroke="#C9D2DF" stroke-width="2" fill="none"/>
<text x="429" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5B6577" letter-spacing="2">CHECK THAT IT WORKS</text><path d="M429 90 v-8 H1135 v8" stroke="#C9D2DF" stroke-width="2" fill="none"/>
<rect x="64" y="112" width="341" height="300" rx="16" fill="#F4F6FA" stroke="#2563EB" stroke-width="2"/>
<rect x="88" y="140" width="91" height="32" rx="16" fill="#2563EB"/>
<text x="133.5" y="162" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">Install</text>
<text x="191" y="164" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="23" fill="#0F172A" font-weight="700">Add in Harness</text>
<rect x="84" y="188" width="89" height="34" rx="17" fill="#FFFFFF" stroke="#C9D2DF" stroke-width="1"/>
<text x="128.5" y="211" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#0F172A" text-anchor="middle">Plugins</text>
<path d="M179 199 l6 6 l-6 6" stroke="#5B6577" stroke-width="2" fill="none"/>
<rect x="193" y="188" width="116" height="34" rx="17" fill="#FFFFFF" stroke="#C9D2DF" stroke-width="1"/>
<text x="251.0" y="211" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#0F172A" text-anchor="middle">Add plugin</text>
<rect x="84" y="238" width="152" height="34" rx="17" fill="#EAF1FE" stroke="#2563EB" stroke-width="1"/>
<text x="160.0" y="261" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#2563EB" text-anchor="middle">dsh-baton-host</text>
<rect x="84" y="288" width="89" height="34" rx="17" fill="#FFFFFF" stroke="#C9D2DF" stroke-width="1"/>
<text x="128.5" y="311" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#0F172A" text-anchor="middle">Install</text>
<path d="M179 299 l6 6 l-6 6" stroke="#5B6577" stroke-width="2" fill="none"/>
<rect x="193" y="288" width="116" height="34" rx="17" fill="#FFFFFF" stroke="#C9D2DF" stroke-width="1"/>
<text x="251.0" y="311" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#0F172A" text-anchor="middle">Enable now</text>
<text x="88" y="362" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#5B6577">Registers Claude Code + Codex.</text>
<path d="M409 262.0 h16" stroke="#5B6577" stroke-width="2"/>
<rect x="429" y="112" width="341" height="300" rx="16" fill="#F4F6FA" stroke="#E2E7EF" stroke-width="1"/>
<circle cx="470" cy="156" r="16" fill="none" stroke="#2563EB" stroke-width="2.5"/>
<text x="470" y="163" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="19" fill="#2563EB" font-weight="700" text-anchor="middle">1</text>
<text x="495" y="164" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="23" fill="#0F172A" font-weight="700">New chat</text>
<text x="453" y="212" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#5B6577">In Claude Code or Codex,</text>
<text x="453" y="240" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#5B6577">open a new conversation.</text>
<text x="453" y="268" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#5B6577">Codex asks once to approve</text>
<text x="453" y="296" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#5B6577">the dsh-baton tools.</text>
<path d="M774 262.0 h16" stroke="#5B6577" stroke-width="2"/>
<rect x="794" y="112" width="341" height="300" rx="16" fill="#F4F6FA" stroke="#E2E7EF" stroke-width="1"/>
<circle cx="835" cy="156" r="16" fill="none" stroke="#2563EB" stroke-width="2.5"/>
<text x="835" y="163" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="19" fill="#2563EB" font-weight="700" text-anchor="middle">2</text>
<text x="860" y="164" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="23" fill="#0F172A" font-weight="700">Check</text>
<text x="818" y="212" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#5B6577">Ask it to call</text>
<rect x="814" y="218" width="301" height="32" rx="8" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/>
<text x="824" y="239" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#2563EB">dsh_list_workspaces</text>
<text x="818" y="280" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#5B6577">Lists your Harness workspaces.</text>
</svg>
