<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Typical dsh-baton flow</title>
  <desc id="desc">Create a workspace, send the task and get a run id, wait without polling (Claude Code is woken once, Codex waits in one dsh_wait call of up to an hour), then follow up in the same session.</desc>
  <rect width="1200" height="400" rx="24" fill="#0D1117"/>
<text x="64" y="76" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" fill="#E6EDF3" font-weight="700">Typical flow</text>
<rect x="64" y="112" width="250" height="250" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
<text x="88" y="172" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="44" fill="#4493F8" font-weight="700">1</text>
<text x="88" y="220" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="21" fill="#E6EDF3" font-weight="700" opacity="1.000">Create a workspace</text>
<rect x="88" y="240" width="202" height="34" rx="8" fill="#0D1117" opacity="1.000"/>
<text x="100" y="263" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#4493F8" opacity="1.000">dsh_create_workspace</text>
<text x="88" y="310" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#9198A1" opacity="1.000">~/code/new-app</text>
<text x="88" y="336" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#9198A1" opacity="1.000">joins the sidebar</text>
<path d="M317 237 l14 0" stroke="#4493F8" stroke-width="2.5"/>
<rect x="338" y="112" width="250" height="250" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
<text x="362" y="172" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="44" fill="#4493F8" font-weight="700">2</text>
<text x="362" y="220" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="21" fill="#E6EDF3" font-weight="700" opacity="1.000">Send the task</text>
<rect x="362" y="240" width="202" height="34" rx="8" fill="#0D1117" opacity="1.000"/>
<text x="374" y="263" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#4493F8" opacity="1.000">dsh_send</text>
<text x="362" y="310" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#9198A1" opacity="1.000">returns run_id +</text>
<text x="362" y="336" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#9198A1" opacity="1.000">session_id at once</text>
<path d="M591 237 l14 0" stroke="#4493F8" stroke-width="2.5"/>
<rect x="612" y="112" width="250" height="250" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
<text x="636" y="172" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="44" fill="#4493F8" font-weight="700">3</text>
<text x="636" y="220" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="21" fill="#E6EDF3" font-weight="700" opacity="1.000">Wait, no polling</text>
<rect x="636" y="240" width="202" height="34" rx="8" fill="#0D1117" opacity="1.000"/>
<text x="648" y="263" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#4493F8" opacity="1.000">dsh_wait</text>
<text x="636" y="310" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#9198A1" opacity="1.000">Codex: one call, up to 59 min</text>
<text x="636" y="336" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#9198A1" opacity="1.000">Claude Code: woken once</text>
<path d="M865 237 l14 0" stroke="#4493F8" stroke-width="2.5"/>
<rect x="886" y="112" width="250" height="250" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
<text x="910" y="172" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="44" fill="#4493F8" font-weight="700">4</text>
<text x="910" y="220" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="21" fill="#E6EDF3" font-weight="700" opacity="1.000">Follow up</text>
<rect x="910" y="240" width="202" height="34" rx="8" fill="#0D1117" opacity="1.000"/>
<text x="922" y="263" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#4493F8" opacity="1.000">dsh_send session_id</text>
<text x="910" y="310" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#9198A1" opacity="1.000">same session, same</text>
<text x="910" y="336" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#9198A1" opacity="1.000">context: "fix tests"</text>
</svg>
