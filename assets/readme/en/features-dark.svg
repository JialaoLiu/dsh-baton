<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="528" viewBox="0 0 1200 528" role="img" aria-labelledby="title desc">
  <title id="title">What dsh-baton does</title>
  <desc id="desc">Six capabilities: create workspaces and sessions, continue a specific session, run live in the Harness UI labelled with the sender, the result comes back once when a run ends (Claude Code is woken, Codex waits up to an hour in one call), no extra API key and any Harness model, macOS and Windows with zero dependencies.</desc>
  <rect width="1200" height="528" rx="24" fill="#0D1117"/>
<rect x="64" y="56" width="341" height="196" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
<g transform="translate(90 80)" stroke="#4493F8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10 h12 l4 5 h20 v21 h-36 z"/><path d="M20 21 v10 M15 26 h10"/></g>
<text x="90" y="160" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#E6EDF3" font-weight="700">Workspaces + sessions</text>
<text x="90" y="198" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#9198A1">Start Harness in any folder;</text>
<text x="90" y="226" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#9198A1">it shows in the sidebar.</text>
<rect x="429" y="56" width="341" height="196" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
<g transform="translate(455 80)" stroke="#4493F8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20 a14 14 0 1 1 6 11"/><path d="M2 14 l4 7 l7 -4"/></g>
<text x="455" y="160" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#E6EDF3" font-weight="700">Continue a session</text>
<text x="455" y="198" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#9198A1">Send by session_id and keep</text>
<text x="455" y="226" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#9198A1">its full context.</text>
<rect x="794" y="56" width="341" height="196" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
<g transform="translate(820 80)" stroke="#4493F8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="36" height="28" rx="4"/><path d="M2 14 h36"/><circle cx="20" cy="24" r="4" fill="#4493F8"/></g>
<text x="820" y="160" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#E6EDF3" font-weight="700">Live in the Harness UI</text>
<text x="820" y="198" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#9198A1">Runs as if typed in Harness,</text>
<text x="820" y="226" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#9198A1">labelled with who sent it.</text>
<rect x="64" y="276" width="341" height="196" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
<g transform="translate(90 300)" stroke="#4493F8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10 28 v-10 a10 10 0 0 1 20 0 v10 l3 4 h-26 z"/><path d="M17 36 h6"/></g>
<text x="90" y="380" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#E6EDF3" font-weight="700">Back when it's done</text>
<text x="90" y="418" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#9198A1">Claude Code is woken once;</text>
<text x="90" y="446" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#9198A1">Codex waits up to 59 min a call.</text>
<rect x="429" y="276" width="341" height="196" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
<g transform="translate(455 300)" stroke="#4493F8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="20" r="7"/><path d="M19 20 h17 M30 20 v6 M35 20 v4"/><path d="M4 36 L36 4" stroke="#9198A1"/></g>
<text x="455" y="380" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#E6EDF3" font-weight="700">No extra API key</text>
<text x="455" y="418" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#9198A1">Desktop sign-in and presets;</text>
<text x="455" y="446" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#9198A1">pick any model Harness has.</text>
<rect x="794" y="276" width="341" height="196" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
<g transform="translate(820 300)" stroke="#4493F8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="18" width="26" height="18" rx="3"/><path d="M13 18 v-6 a7 7 0 0 1 14 0 v6"/></g>
<text x="820" y="380" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#E6EDF3" font-weight="700">macOS + Windows</text>
<text x="820" y="418" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#9198A1">Zero deps; owner-only socket</text>
<text x="820" y="446" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#9198A1">or pipe, no network port.</text>
</svg>
