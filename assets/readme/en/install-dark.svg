<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="444" viewBox="0 0 1200 444" role="img" aria-labelledby="title desc">
  <title id="title">Set up dsh-baton in three steps</title>
  <desc id="desc">Step 1: in Harness open Plugins, Add plugin, enter dsh-baton-host, Install, Enable now; it registers dsh-baton for Claude Code and Codex. Step 2: open a new conversation in Claude Code or Codex; Codex asks once to approve the dsh-baton tools. Step 3: ask it to call dsh_list_workspaces; it lists your Harness workspaces.</desc>
  <rect width="1200" height="444" rx="24" fill="#0D1117"/>
<text x="64" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#9198A1" letter-spacing="2">THREE STEPS</text>
<rect x="64" y="104" width="341" height="300" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
<text x="88" y="162" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="44" fill="#4493F8" font-weight="700">1</text>
<text x="130" y="156" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="23" fill="#E6EDF3" font-weight="700">Add in Harness</text>
<rect x="84" y="180" width="89" height="34" rx="17" fill="#0D1117" stroke="#484F58" stroke-width="1"/>
<text x="128.5" y="203" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#E6EDF3" text-anchor="middle">Plugins</text>
<path d="M179 191 l6 6 l-6 6" stroke="#9198A1" stroke-width="2" fill="none"/>
<rect x="193" y="180" width="116" height="34" rx="17" fill="#0D1117" stroke="#484F58" stroke-width="1"/>
<text x="251.0" y="203" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#E6EDF3" text-anchor="middle">Add plugin</text>
<rect x="84" y="230" width="152" height="34" rx="17" fill="#132A4A" stroke="#4493F8" stroke-width="1"/>
<text x="160.0" y="253" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#4493F8" text-anchor="middle">dsh-baton-host</text>
<rect x="84" y="280" width="89" height="34" rx="17" fill="#0D1117" stroke="#484F58" stroke-width="1"/>
<text x="128.5" y="303" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#E6EDF3" text-anchor="middle">Install</text>
<path d="M179 291 l6 6 l-6 6" stroke="#9198A1" stroke-width="2" fill="none"/>
<rect x="193" y="280" width="116" height="34" rx="17" fill="#0D1117" stroke="#484F58" stroke-width="1"/>
<text x="251.0" y="303" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#E6EDF3" text-anchor="middle">Enable now</text>
<text x="88" y="354" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#9198A1">Registers Claude Code + Codex.</text>
<path d="M409 254.0 h16" stroke="#9198A1" stroke-width="2"/>
<rect x="429" y="104" width="341" height="300" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
<text x="453" y="162" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="44" fill="#4493F8" font-weight="700">2</text>
<text x="495" y="156" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="23" fill="#E6EDF3" font-weight="700">New chat</text>
<text x="453" y="204" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#9198A1">In Claude Code or Codex,</text>
<text x="453" y="232" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#9198A1">open a new conversation.</text>
<text x="453" y="260" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#9198A1">Codex asks once to approve</text>
<text x="453" y="288" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#9198A1">the dsh-baton tools.</text>
<path d="M774 254.0 h16" stroke="#9198A1" stroke-width="2"/>
<rect x="794" y="104" width="341" height="300" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
<text x="818" y="162" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="44" fill="#4493F8" font-weight="700">3</text>
<text x="860" y="156" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="23" fill="#E6EDF3" font-weight="700">Check</text>
<text x="818" y="204" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#9198A1">Ask it to call</text>
<rect x="814" y="210" width="301" height="32" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
<text x="824" y="231" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#4493F8">dsh_list_workspaces</text>
<text x="818" y="272" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#9198A1">Lists your Harness workspaces.</text>
</svg>
