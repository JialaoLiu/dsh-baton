<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Security</title>
  <desc id="desc">The socket is 0600 on macOS and Linux and a per-user named pipe on Windows, so only your OS user can drive it; the plugin opens no network port and contacts no external service; runs follow Harness sandbox and approval settings.</desc>
  <rect width="1200" height="320" rx="24" fill="#0D1117"/>
<text x="64" y="76" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" fill="#E6EDF3" font-weight="700">Security</text>
<rect x="64" y="104" width="341" height="180" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
<rect x="64" y="130" width="4" height="30" fill="#4493F8"/>
<text x="90" y="154" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" fill="#E6EDF3" font-weight="700">Owner-only channel</text>
<text x="90" y="196" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#9198A1">Socket 0600 on macOS/Linux,</text>
<text x="90" y="224" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#9198A1">per-user pipe on Windows.</text>
<rect x="429" y="104" width="341" height="180" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
<rect x="429" y="130" width="4" height="30" fill="#4493F8"/>
<text x="455" y="154" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" fill="#E6EDF3" font-weight="700">No network port</text>
<text x="455" y="196" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#9198A1">Contacts no external</text>
<text x="455" y="224" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#9198A1">service at all.</text>
<rect x="794" y="104" width="341" height="180" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
<rect x="794" y="130" width="4" height="30" fill="#4493F8"/>
<text x="820" y="154" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" fill="#E6EDF3" font-weight="700">Harness rules apply</text>
<text x="820" y="196" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#9198A1">Runs use Harness's own</text>
<text x="820" y="224" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#9198A1">sandbox and approvals.</text>
</svg>
