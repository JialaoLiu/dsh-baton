<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">dsh-baton run states</title>
  <desc id="desc">A run moves from queued to running and ends completed, failed or cancelled, or interrupted if Harness restarts mid-run. Running can pause in waiting when Harness needs a person. When a session is busy, followup queues the message and steer interjects at the next step.</desc>
  <rect width="1200" height="520" rx="24" fill="#0D1117"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9198A1"/></marker></defs>
<text x="64" y="76" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" fill="#E6EDF3" font-weight="700">Every message gets its own run</text>
<g transform="translate(0 56)">
<rect x="64" y="150" width="170" height="52" rx="26" fill="#161B22" stroke="#E6EDF3" stroke-width="2"/><text x="149.0" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#E6EDF3" font-weight="700" text-anchor="middle">queued</text>
<path d="M234 176 H 306" stroke="#9198A1" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect x="310" y="150" width="170" height="52" rx="26" fill="#161B22" stroke="#D29922" stroke-width="2"/><text x="395.0" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#D29922" font-weight="700" text-anchor="middle">running</text>
<path d="M480 176 H 552" stroke="#9198A1" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect x="556" y="150" width="190" height="52" rx="26" fill="#4493F8" stroke="#4493F8" stroke-width="2"/><text x="651.0" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#0D1117" font-weight="700" text-anchor="middle">completed</text>
<rect x="556" y="236" width="170" height="52" rx="26" fill="#161B22" stroke="#F85149" stroke-width="2"/><text x="641.0" y="269" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#F85149" font-weight="700" text-anchor="middle">failed</text>
<rect x="556" y="64" width="170" height="52" rx="26" fill="#161B22" stroke="#9198A1" stroke-width="2"/><text x="641.0" y="97" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#9198A1" font-weight="700" text-anchor="middle">cancelled</text>
<path d="M480 186 C 520 186, 520 262, 552 262" stroke="#9198A1" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<path d="M480 166 C 520 166, 520 90, 552 90" stroke="#9198A1" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect x="310" y="290" width="170" height="52" rx="26" fill="#161B22" stroke="#A371F7" stroke-width="2"/><text x="395.0" y="323" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#A371F7" font-weight="700" text-anchor="middle">waiting</text>
<path d="M380 202 V 286" stroke="#9198A1" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<path d="M410 290 V 206" stroke="#9198A1" stroke-width="2" fill="none" stroke-dasharray="4 5" marker-end="url(#ah)"/>
<text x="310" y="372" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#9198A1">Harness needs a person:</text>
<text x="310" y="398" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#9198A1">an approval or a question.</text>
<text x="556" y="340" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#9198A1">completed = turn ended and</text>
<text x="556" y="366" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#9198A1">sub-agents + jobs finished.</text>
<rect x="64" y="290" width="190" height="52" rx="26" fill="#161B22" stroke="#9198A1" stroke-width="2"/><text x="159.0" y="323" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#9198A1" font-weight="700" text-anchor="middle">interrupted</text>
<path d="M318 202 C 300 260, 290 316, 258 316" stroke="#9198A1" stroke-width="2" fill="none" stroke-dasharray="4 5" marker-end="url(#ah)"/>
<text x="64" y="372" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#9198A1">Harness restarted</text>
<text x="64" y="398" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#9198A1">mid-run.</text>
</g>
<rect x="820" y="160" width="316" height="340" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1"/>
<text x="846" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#4493F8" letter-spacing="2">SESSION BUSY?</text>
<text x="846" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#E6EDF3" font-weight="700">followup</text>
<text x="846" y="282" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#9198A1">Queued, runs after the</text>
<text x="846" y="310" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#9198A1">current task.</text>
<line x1="846" y1="346" x2="1110" y2="346" stroke="#30363D"/>
<text x="846" y="390" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#E6EDF3" font-weight="700">steer</text>
<text x="846" y="420" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#9198A1">Interjects at the agent's</text>
<text x="846" y="448" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#9198A1">next step.</text>
<text x="846" y="484" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#9198A1">Unset: your Harness setting.</text>
</svg>
