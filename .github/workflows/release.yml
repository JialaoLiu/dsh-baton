# Publishes dsh-baton-host and dsh-baton-mcp to npm when a version tag is pushed.
# npm trusts this workflow (Trusted Publishing, set up once per package on npmjs.com),
# so it needs no token and no one-time password. See docs/RELEASE.md.
#   v0.4.1        -> both packages under `latest`
#   v0.5.0-next.0 -> both packages under `next`
# A version that is already on npm (say, tried under `next` first) is not published
# again: pushing its plain tag moves `latest` to it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets npm verify this workflow instead of a token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.21.1

      - name: Tag and both package versions agree
        run: |
          node scripts/version.mjs
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - run: npm test

      - name: Publish, or move the tag of an already published version
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          for dir in host .; do
            name=$(node -p "require('./$dir/package.json').name")
            # npm view prints nothing (and still exits 0) for a version that does not exist.
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$name@$version is already on npm: tagging it $tag"
              npm dist-tag add "$name@$version" "$tag"
            else
              (cd "$dir" && npm publish --access public --tag "$tag")
            fi
          done
